[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pyfix-traceback"
version = "2.0.0"
description = "Traceback-based bug classification and test-verified Python repair"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.6,<1.9", "numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-dotenv>=1.0", "pytest>=8.0", "joblib>=1.3"]
[project.scripts]
pyfix = "pyfix.cli:main"
[tool.setuptools.package-data]
pyfix = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pyfix*"]
exclude = ["tests*", "data*", "artifacts*", "docs*"]
